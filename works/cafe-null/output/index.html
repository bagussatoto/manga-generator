<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sinyal Misterius di Kafe Tengah Malam 改訂版</title><style>body{background:#e7e5e0;margin:0;font-family:Meiryo,sans-serif}header{max-width:850px;margin:28px auto;padding:20px}h1{font-size:24px}main{max-width:950px;margin:auto}img{width:100%;display:block;margin-bottom:26px}@media print{header{display:none}img{height:100vh;object-fit:contain;break-after:page}}</style><header><h1>Sinyal Misterius di Kafe Tengah Malam — 改訂版</h1><p>原作： ／ 右から左、上から下へ。セリフとコマ割りを先に確定して制作。</p><a href="../workflow/storyboards/index.html">制作前のネーム</a> · <a href="reader.html">1ページずつ読む</a></header><main><img src="page-01.svg" alt="narration: Pukul 02:00 pagi. Saat sebagian besar dunia terlelap, kafe ini justru baru mulai hidup. / rian: Tunggu... Gelombang frekuensi apa ini? Dari mana asalnya?!"><img src="page-02.svg" alt="tio: Sepertinya pelanggan istimewa kita malam ini datang lebih cepat, Rian. / rian: Jangan bilang... sinyal itu bukan dari satelit bumi?"><img src="page-03.svg" alt="narration: Satu espresso hangat... untuk perjalanan lintas galaksi. / rian: Baiklah, mari kita layani pelanggan terjauh kita malam ini."><img src="page-04.svg" alt="narration: Pukul 02:05 pagi. Batas antara dimensi lokal dan kosmik perlahan melebur. / tio: Selamat datang di Café Null. Silakan pilih tempat duduk yang nyaman. / rian: Dia benar-benar datang... Pesanan dari luar tata surya, secara langsung!"><img src="page-05.svg" alt="vane: Perjalanan dari Nebula Orion cukup melelahkan. Apakah kopimu cukup kuat untuk membangunkan kesadaran yang melintasi dimensi waktu? / rian: Tentu saja. Di kafe ini, kami menyeduh kopi bukan cuma untuk kafein, tapi untuk menyelamatkan penjelajah yang tersesat di sunyinya malam semesta. / narration: Malam masih panjang di Café Null. Dan bagi mereka yang mencari kehangatan, pintu ini selalu terbuka... di mana pun koordinat mereka."></main></html>
